[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "joblib>=1.6.0",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "gunicorn",
]

# Not required to run the app. Only used by scripts/compare_models.py to
# reproduce the Random Forest vs LightGBM vs XGBoost comparison referenced
# in MODEL_SELECTION.md. Install with: pip install -e ".[model-comparison]"
[project.optional-dependencies]
model-comparison = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
